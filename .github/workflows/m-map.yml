name: m-map

on:
  push:
    paths: ["m-map/**", ".github/workflows/m-map.yml"]
  pull_request:
    paths: ["m-map/**", ".github/workflows/m-map.yml"]

defaults:
  run:
    working-directory: m-map

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmap
          POSTGRES_USER: mmap
          POSTGRES_PASSWORD: mmap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mmap" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://mmap:mmap@localhost:5432/mmap
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: m-map/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: m-map/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Миграции на чистой базе
        run: pnpm db:migrate
      - name: Схема совпадает с миграциями
        working-directory: m-map/apps/web
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle || (echo "Схема изменена без миграции: pnpm db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)"
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Образы собираются
        run: docker compose build
      - name: Стек поднимается одной командой
        run: |
          cp .env.example .env
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=8080/; s/^HTTPS_PORT=.*/HTTPS_PORT=8443/' .env
          docker compose up -d --wait --wait-timeout 180
          curl -fsk https://localhost:8443/healthz
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/metrics)" = 404
      - if: failure()
        run: docker compose logs --tail 100
