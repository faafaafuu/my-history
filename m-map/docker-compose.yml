# Life Map: docker compose up -d
# Настройки — в .env (шаблон: .env.example). Postgres наружу не публикуется.

name: m-map

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-mmap}
  POSTGRES_USER: ${POSTGRES_USER:-mmap}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmap}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: m-map/web:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mmap}:${POSTGRES_PASSWORD:-mmap}@postgres:5432/${POSTGRES_DB:-mmap}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      APP_URL: ${APP_URL:-https://localhost}
      # LLM (этап 3): провайдер и модель — только через env.
      LLM_PROVIDER: ${LLM_PROVIDER:-bridge}
      LLM_FALLBACK: ${LLM_FALLBACK:-openrouter}
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-}
      CLAUDE_BRIDGE_TOKEN: ${CLAUDE_BRIDGE_TOKEN:-}
      CLAUDE_BRIDGE_MODEL: ${CLAUDE_BRIDGE_MODEL:-sonnet}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-30}
      # Web Push (этап 5)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    extra_hosts:
      # Мост на этом же сервере: CLAUDE_BRIDGE_URL=http://host.docker.internal:8791
      - host.docker.internal:host-gateway
    networks: [internal, metrics]

  nginx:
    build: docker/nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    networks: [internal]

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-}
    volumes:
      - ./docker/certbot/entrypoint.sh:/entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot

  backup:
    build: docker/backup
    restart: unless-stopped
    depends_on:
      # web здоров = миграции применены: первый дамп уже со схемой.
      web:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-mmap}
      PGUSER: ${POSTGRES_USER:-mmap}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mmap}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
    volumes:
      # Каталог на хосте, не публичный (chmod 700 внутри). Не кладите его в webroot.
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [internal]

volumes:
  pgdata:
  letsencrypt:
  acme:

networks:
  internal:
  # Сеть для Prometheus: подключите к ней существующий Prometheus
  # и скрейпьте web:3000/metrics (см. docs/deploy.md).
  metrics:
    name: ${METRICS_NETWORK:-m-map-metrics}
